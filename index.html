<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捌桔兔 - 日系雜貨、玩具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==================== 1. 首頁連結頁 ==================== -->
  <div id="home-view" class="home-container">
    <div class="home-banner">
      <img src="text_youkoso.png" alt="歡迎光臨 捌桔兔">
    </div>

    <div class="brand-info">
      <h1>捌桔兔 - 日系雜貨、玩具</h1>
      <p class="brand-id">@8mikan2</p>
    </div>

    <div class="social-links">
      <a href="https://www.instagram.com/8mikan2/" target="_blank" class="social-btn instagram">
        <span>Instagram</span>
      </a>
      <a href="https://www.threads.com/@8mikan2" target="_blank" class="social-btn threads">
        <span>Threads</span>
      </a>
      <a href="#" class="social-btn community disabled" onclick="alert('社群籌備中，敬請期待！'); return false;">
        <span>官方社群（籌備中）</span>
      </a>
    </div>

    <div class="menu-enter-area">
      <a href="?view=catalog" class="enter-menu-btn">🛍️ 查看商品選單</a>
    </div>
  </div>


  <!-- ==================== 2. 選單總覽頁（大廳） ==================== -->
  <div id="catalog-view" style="display: none; position: relative; min-height: 100vh;">
    <header class="shop-header">
      <a href="./" class="back-home">‹ 返回首頁</a>
      <h2>捌桔兔 ✦ 一起來買買買吧！</h2>
      
      <!-- 右上角搜尋欄 -->
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜尋..." oninput="filterGroups()">
        <span class="search-icon">🔍</span>
      </div>
    </header>

    <div class="catalog-container">
      <div class="section-title">一起來買買買吧！</div>
      <!-- 自動渲染團購卡片區 -->
      <div class="group-grid" id="group-list"></div>
    </div>

    <!-- 左下角鴨鴨圖片 (300x300) -->
    <img src="duck.png" alt="鴨鴨" class="duck-img">
  </div>


  <!-- ==================== 3. 單一團購商品頁 ==================== -->
  <div id="shop-view" style="display: none;">
    <!-- 頂部公告 -->
    <div class="top-announcement" id="top-announcement">📢 歡迎選購</div>

    <header class="shop-header">
      <a href="?view=catalog" class="back-home">‹ 返回開團總覽</a>
      <h2 id="group-title">載入中...</h2>
    </header>

    <!-- 宣傳大圖 -->
    <div class="banner-container">
      <img src="logo.png" id="banner-img" alt="團購宣傳圖">
    </div>

    <!-- 商品列表 -->
    <main class="product-grid" id="product-list"></main>

    <!-- 右下角購物車 -->
    <div class="cart-btn" onclick="toggleCart()">
      🛒 <span id="cart-count">0</span>
    </div>

    <!-- 購物車視窗 -->
    <div class="cart-modal" id="cart-modal">
      <div class="cart-content">
        <div class="cart-header">
          <h2>我的購物車</h2>
          <button onclick="toggleCart()" style="background:none; border:none; font-size:20px; cursor:pointer;">✕</button>
        </div>
        <div class="cart-body" id="cart-items" style="padding: 15px 0;"></div>
        <div class="cart-footer">
          <p style="font-weight:bold;">總計金額：$<span id="cart-total">0</span></p>
          <button onclick="checkout()">確認訂購（傳送 LINE）</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
